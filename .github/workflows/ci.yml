name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manifest
        run: bash tests/check-manifest.sh

      - name: Unit tests (JavaScript)
        run: node --test tests/*.test.js

      - name: Syntax
        run: bash -n tests/check-manifest.sh
